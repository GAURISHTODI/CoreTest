server:
  port: 8080

spring:
  application:
    name: order-service

  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/orders_db}
    username: ${ORDER_DB_USER:postgres}
    password: ${ORDER_DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.coretest.order: DEBUG
    org.hibernate.SQL: DEBUG
